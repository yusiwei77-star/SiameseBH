<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BHmap Region Annotator</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --panel: #ffffff;
      --line: #d9dee6;
      --text: #17202a;
      --muted: #64748b;
      --accent: #176b87;
      --accent-soft: #dff2f6;
      --warn: #b45309;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Arial, "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }

    .app {
      display: grid;
      grid-template-columns: 380px minmax(0, 1fr);
      height: 100vh;
      min-width: 880px;
    }

    aside {
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
      padding: 16px;
      border-right: 1px solid var(--line);
      background: var(--panel);
    }

    main {
      position: relative;
      min-width: 0;
      overflow: hidden;
      background: #101820;
    }

    h1 {
      margin: 0;
      font-size: 19px;
      line-height: 1.25;
      font-weight: 700;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 13px;
      line-height: 1.25;
      color: #334155;
      font-weight: 700;
    }

    .subtle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .section {
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button, label.file-button, select, input {
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: #1f2937;
      font: inherit;
      font-size: 13px;
    }

    button, label.file-button {
      min-height: 34px;
      padding: 7px 10px;
      line-height: 1.2;
      cursor: pointer;
      user-select: none;
      transition: border-color .12s ease, background .12s ease, color .12s ease;
    }

    button:hover, label.file-button:hover {
      border-color: #9eb7c1;
      background: #f8fbfc;
    }

    button.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: #0f4f63;
      font-weight: 700;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .45;
    }

    input[type="file"] {
      display: none;
    }

    input, select {
      width: 100%;
      height: 34px;
      padding: 6px 9px;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    .field-grid {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 8px 10px;
      align-items: center;
    }

    .field-grid label {
      color: #334155;
      font-size: 13px;
    }

    .region-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 300px;
      overflow: auto;
      padding-right: 3px;
    }

    .region-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      width: 100%;
      text-align: left;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      padding: 8px 9px;
      cursor: pointer;
    }

    .region-item.active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .region-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 700;
    }

    .region-meta {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 8px;
      background: #f8fafc;
    }

    .stat strong {
      display: block;
      font-size: 16px;
      line-height: 1.2;
    }

    .stat span {
      color: var(--muted);
      font-size: 11px;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    canvas.panning {
      cursor: grab;
    }

    .status {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 14px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      pointer-events: none;
      color: #e6edf3;
      font-size: 12px;
    }

    .status span {
      max-width: 48%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 7px 10px;
      border-radius: 7px;
      background: rgba(10, 16, 24, .78);
      box-shadow: var(--shadow);
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <section class="section">
        <h1>BHmap Region Annotator</h1>
        <p class="subtle">Regions are generated from terrain cells in annotations.json using 4-neighbor connectivity.</p>
      </section>

      <section class="section">
        <h2>Data</h2>
        <div class="button-row">
          <label class="file-button" for="terrainFile">Import Terrain JSON</label>
          <input id="terrainFile" type="file" accept="application/json,.json">
          <label class="file-button" for="regionsFile">Import Regions JSON</label>
          <input id="regionsFile" type="file" accept="application/json,.json">
          <button id="exportRegions" type="button" disabled>Export Regions JSON</button>
        </div>
        <p class="subtle" id="dataStatus">Loading annotations.json...</p>
      </section>

      <section class="section">
        <h2>Region Filter</h2>
        <select id="terrainFilter">
          <option value="all">All generated terrains</option>
          <option value="building">building</option>
          <option value="sports_field">sports_field</option>
          <option value="gate">gate</option>
        </select>
        <div class="stats" style="margin-top:8px">
          <div class="stat"><strong id="regionTotal">0</strong><span>regions</span></div>
          <div class="stat"><strong id="cellTotal">0</strong><span>cells</span></div>
          <div class="stat"><strong id="entranceTotal">0</strong><span>entrances</span></div>
        </div>
      </section>

      <section class="section">
        <h2>Regions</h2>
        <div id="regionList" class="region-list"></div>
      </section>

      <section class="section">
        <h2>Selected Region</h2>
        <div class="field-grid">
          <label>ID</label>
          <input id="regionId" type="text" readonly>
          <label>terrain</label>
          <input id="regionTerrain" type="text" readonly>
          <label>area</label>
          <input id="regionArea" type="number" readonly>
          <label>name</label>
          <input id="regionName" type="text">
          <label>function</label>
          <input id="regionFunction" type="text">
          <label>available</label>
          <input id="regionAvailable" type="checkbox">
          <label>open_time</label>
          <input id="regionOpenTime" type="time">
          <label>close_time</label>
          <input id="regionCloseTime" type="time">
        </div>
        <div class="button-row" style="margin-top:10px">
          <button id="entranceMode" type="button">Entrance Mode</button>
          <button id="clearEntrances" type="button">Clear Entrances</button>
        </div>
        <p class="subtle" id="selectedStatus">Select a region to edit metadata.</p>
      </section>
    </aside>

    <main>
      <canvas id="mapCanvas"></canvas>
      <div class="status">
        <span id="viewportStatus">Loading BHmap.png...</span>
        <span id="cellStatus">No cell</span>
      </div>
    </main>
  </div>

  <script>
    "use strict";

    const IMAGE_NAME = "BHmap.png";
    const ANNOTATION_NAME = "annotations.json";
    const GRID_SIZE = 25;
    const GENERATED_TERRAINS = new Set(["building", "sports_field", "gate"]);
    const terrainPalette = {
      building: "#d35400",
      sports_field: "#27ae60",
      gate: "#8e44ad"
    };

    const canvas = document.getElementById("mapCanvas");
    const ctx = canvas.getContext("2d", { alpha: false });
    const img = new Image();

    let imageSize = { width: 0, height: 0 };
    let sourceAnnotation = null;
    let regions = [];
    let regionById = new Map();
    let regionByCell = new Map();
    let selectedRegionId = null;
    let terrainFilter = "all";
    let entranceMode = false;
    let view = { scale: 1, x: 0, y: 0 };
    let canvasSize = { width: 1, height: 1, dpr: 1 };
    let pointerState = null;
    let spaceDown = false;
    let rafPending = false;

    function keyOf(row, col) {
      return `${row},${col}`;
    }

    function parseKey(key) {
      const [row, col] = key.split(",").map(Number);
      return { row, col };
    }

    function colorFor(label) {
      return terrainPalette[label] || "#6b7280";
    }

    function hexToRgba(hex, alpha) {
      const n = Number.parseInt(hex.slice(1), 16);
      return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
    }

    function screenToWorld(x, y) {
      return { x: (x - view.x) / view.scale, y: (y - view.y) / view.scale };
    }

    function worldToCell(world) {
      return { row: Math.floor(world.y / GRID_SIZE), col: Math.floor(world.x / GRID_SIZE) };
    }

    function eventPoint(event) {
      const rect = canvas.getBoundingClientRect();
      return { x: event.clientX - rect.left, y: event.clientY - rect.top };
    }

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvasSize = {
        width: Math.max(1, Math.floor(rect.width)),
        height: Math.max(1, Math.floor(rect.height)),
        dpr
      };
      canvas.width = Math.floor(canvasSize.width * dpr);
      canvas.height = Math.floor(canvasSize.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      requestRender();
    }

    function fitImage() {
      if (!imageSize.width || !imageSize.height) return;
      const scale = Math.min(canvasSize.width / imageSize.width, canvasSize.height / imageSize.height) * 0.96;
      view.scale = Math.max(0.02, scale);
      view.x = (canvasSize.width - imageSize.width * view.scale) / 2;
      view.y = (canvasSize.height - imageSize.height * view.scale) / 2;
      requestRender();
    }

    function requestRender() {
      if (rafPending) return;
      rafPending = true;
      requestAnimationFrame(() => {
        rafPending = false;
        render();
      });
    }

    function render() {
      ctx.setTransform(canvasSize.dpr, 0, 0, canvasSize.dpr, 0, 0);
      ctx.fillStyle = "#101820";
      ctx.fillRect(0, 0, canvasSize.width, canvasSize.height);
      if (!img.complete || !imageSize.width) return;

      const left = Math.max(0, (0 - view.x) / view.scale);
      const top = Math.max(0, (0 - view.y) / view.scale);
      const right = Math.min(imageSize.width, (canvasSize.width - view.x) / view.scale);
      const bottom = Math.min(imageSize.height, (canvasSize.height - view.y) / view.scale);

      if (right > left && bottom > top) {
        ctx.imageSmoothingEnabled = true;
        ctx.drawImage(
          img,
          left, top, right - left, bottom - top,
          view.x + left * view.scale,
          view.y + top * view.scale,
          (right - left) * view.scale,
          (bottom - top) * view.scale
        );
      }

      const rowStart = Math.max(0, Math.floor(top / GRID_SIZE) - 1);
      const rowEnd = Math.min(Math.ceil(imageSize.height / GRID_SIZE) - 1, Math.ceil(bottom / GRID_SIZE) + 1);
      const colStart = Math.max(0, Math.floor(left / GRID_SIZE) - 1);
      const colEnd = Math.min(Math.ceil(imageSize.width / GRID_SIZE) - 1, Math.ceil(right / GRID_SIZE) + 1);
      drawRegions(rowStart, rowEnd, colStart, colEnd);
      drawGrid(rowStart, rowEnd, colStart, colEnd);
      updateViewportStatus();
    }

    function drawRegions(rowStart, rowEnd, colStart, colEnd) {
      const selected = selectedRegionId ? regionById.get(selectedRegionId) : null;
      const selectedCellSet = selected?.cellSet;
      for (const region of visibleRegions()) {
        if (region.bounds.rowMax < rowStart || region.bounds.rowMin > rowEnd || region.bounds.colMax < colStart || region.bounds.colMin > colEnd) continue;
        const isSelected = region.id === selectedRegionId;
        ctx.fillStyle = hexToRgba(colorFor(region.terrain), isSelected ? 0.56 : 0.32);
        for (const key of region.cellKeys) {
          const { row, col } = parseKey(key);
          if (row < rowStart || row > rowEnd || col < colStart || col > colEnd) continue;
          const x = view.x + col * GRID_SIZE * view.scale;
          const y = view.y + row * GRID_SIZE * view.scale;
          const w = Math.min(GRID_SIZE, imageSize.width - col * GRID_SIZE) * view.scale;
          const h = Math.min(GRID_SIZE, imageSize.height - row * GRID_SIZE) * view.scale;
          ctx.fillRect(x, y, w, h);
        }
      }

      if (selectedCellSet) {
        ctx.strokeStyle = "rgba(255,255,255,.95)";
        ctx.lineWidth = Math.max(2, Math.min(4, view.scale * 5));
        for (const key of selectedCellSet) {
          const { row, col } = parseKey(key);
          if (row < rowStart || row > rowEnd || col < colStart || col > colEnd) continue;
          const x = view.x + col * GRID_SIZE * view.scale;
          const y = view.y + row * GRID_SIZE * view.scale;
          const w = Math.min(GRID_SIZE, imageSize.width - col * GRID_SIZE) * view.scale;
          const h = Math.min(GRID_SIZE, imageSize.height - row * GRID_SIZE) * view.scale;
          ctx.strokeRect(x + 1, y + 1, Math.max(0, w - 2), Math.max(0, h - 2));
        }
      }

      if (selected) drawEntrances(selected, rowStart, rowEnd, colStart, colEnd);
    }

    function drawEntrances(region, rowStart, rowEnd, colStart, colEnd) {
      ctx.fillStyle = "#facc15";
      ctx.strokeStyle = "#111827";
      ctx.lineWidth = 2;
      for (const entrance of region.entrances) {
        if (entrance.row < rowStart || entrance.row > rowEnd || entrance.col < colStart || entrance.col > colEnd) continue;
        const x = view.x + (entrance.col + 0.5) * GRID_SIZE * view.scale;
        const y = view.y + (entrance.row + 0.5) * GRID_SIZE * view.scale;
        const r = Math.max(4, Math.min(10, GRID_SIZE * view.scale * 0.35));
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }
    }

    function drawGrid(rowStart, rowEnd, colStart, colEnd) {
      if (view.scale < 0.18) return;
      ctx.beginPath();
      ctx.strokeStyle = view.scale < 0.45 ? "rgba(255,255,255,.18)" : "rgba(255,255,255,.34)";
      ctx.lineWidth = 1;
      for (let col = colStart; col <= colEnd + 1; col++) {
        const x = Math.round(view.x + col * GRID_SIZE * view.scale) + 0.5;
        ctx.moveTo(x, view.y + rowStart * GRID_SIZE * view.scale);
        ctx.lineTo(x, view.y + (rowEnd + 1) * GRID_SIZE * view.scale);
      }
      for (let row = rowStart; row <= rowEnd + 1; row++) {
        const y = Math.round(view.y + row * GRID_SIZE * view.scale) + 0.5;
        ctx.moveTo(view.x + colStart * GRID_SIZE * view.scale, y);
        ctx.lineTo(view.x + (colEnd + 1) * GRID_SIZE * view.scale, y);
      }
      ctx.stroke();
    }

    function generateRegions(annotation) {
      const terrainByCell = new Map();
      for (const cell of annotation.cells || []) {
        if (!Number.isInteger(cell.row) || !Number.isInteger(cell.col)) continue;
        if (!GENERATED_TERRAINS.has(cell.terrain)) continue;
        terrainByCell.set(keyOf(cell.row, cell.col), cell.terrain);
      }

      const visited = new Set();
      const found = [];
      for (const [startKey, terrain] of terrainByCell.entries()) {
        if (visited.has(startKey)) continue;
        const stack = [startKey];
        const cellKeys = [];
        visited.add(startKey);
        let rowMin = Infinity, rowMax = -Infinity, colMin = Infinity, colMax = -Infinity;

        while (stack.length) {
          const key = stack.pop();
          const { row, col } = parseKey(key);
          cellKeys.push(key);
          rowMin = Math.min(rowMin, row);
          rowMax = Math.max(rowMax, row);
          colMin = Math.min(colMin, col);
          colMax = Math.max(colMax, col);
          const neighbors = [
            keyOf(row - 1, col),
            keyOf(row + 1, col),
            keyOf(row, col - 1),
            keyOf(row, col + 1)
          ];
          for (const nextKey of neighbors) {
            if (visited.has(nextKey) || terrainByCell.get(nextKey) !== terrain) continue;
            visited.add(nextKey);
            stack.push(nextKey);
          }
        }

        cellKeys.sort((a, b) => {
          const pa = parseKey(a);
          const pb = parseKey(b);
          return pa.row - pb.row || pa.col - pb.col;
        });

        found.push({
          terrain,
          cellKeys,
          cellSet: new Set(cellKeys),
          cellCount: cellKeys.length,
          area: cellKeys.length,
          bounds: { rowMin, colMin, rowMax, colMax },
          name: "",
          function: "",
          entrances: [],
          available: true,
          open_time: "00:00",
          close_time: "23:59"
        });
      }

      found.sort((a, b) => a.terrain.localeCompare(b.terrain) || a.bounds.rowMin - b.bounds.rowMin || a.bounds.colMin - b.bounds.colMin);
      const perTerrain = new Map();
      for (const region of found) {
        const next = (perTerrain.get(region.terrain) || 0) + 1;
        perTerrain.set(region.terrain, next);
        region.id = `${region.terrain}_${String(next).padStart(3, "0")}`;
      }

      return found;
    }

    function setRegions(nextRegions) {
      regions = nextRegions;
      regionById = new Map(regions.map(region => [region.id, region]));
      regionByCell = new Map();
      for (const region of regions) {
        for (const key of region.cellKeys) regionByCell.set(key, region.id);
      }
      selectedRegionId = null;
      document.getElementById("exportRegions").disabled = regions.length === 0;
      renderRegionList();
      renderSelectedRegion();
      updateStats();
      requestRender();
    }

    function visibleRegions() {
      return terrainFilter === "all" ? regions : regions.filter(region => region.terrain === terrainFilter);
    }

    function renderRegionList() {
      const root = document.getElementById("regionList");
      root.innerHTML = "";
      const list = visibleRegions();
      if (!list.length) {
        const empty = document.createElement("p");
        empty.className = "subtle";
        empty.textContent = "No regions in this filter.";
        root.appendChild(empty);
        return;
      }

      for (const region of list) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `region-item${region.id === selectedRegionId ? " active" : ""}`;
        const title = region.name ? `${region.id} - ${region.name}` : region.id;
        button.innerHTML = `<span class="region-title">${escapeHtml(title)}</span><span class="region-meta">${region.terrain} / area ${region.area}</span>`;
        button.addEventListener("click", () => selectRegion(region.id));
        root.appendChild(button);
      }
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function selectRegion(id) {
      if (!regionById.has(id)) return;
      selectedRegionId = selectedRegionId === id ? null : id;
      renderRegionList();
      renderSelectedRegion();
      requestRender();
    }

    function selectedRegion() {
      return selectedRegionId ? regionById.get(selectedRegionId) : null;
    }

    function renderSelectedRegion() {
      const region = selectedRegion();
      const disabled = !region;
      for (const id of ["regionName", "regionFunction", "regionAvailable", "regionOpenTime", "regionCloseTime", "entranceMode", "clearEntrances"]) {
        document.getElementById(id).disabled = disabled;
      }
      document.getElementById("regionId").value = region?.id || "";
      document.getElementById("regionTerrain").value = region?.terrain || "";
      document.getElementById("regionArea").value = region?.area ?? "";
      document.getElementById("regionName").value = region?.name || "";
      document.getElementById("regionFunction").value = region?.function || "";
      document.getElementById("regionAvailable").checked = !!region?.available;
      document.getElementById("regionOpenTime").value = region?.open_time || "00:00";
      document.getElementById("regionCloseTime").value = region?.close_time || "23:59";
      document.getElementById("selectedStatus").textContent = region
        ? `${region.id}: ${region.cellCount} cells, ${region.entrances.length} entrances`
        : "Select a region to edit metadata.";
      document.getElementById("entranceMode").classList.toggle("active", entranceMode);
    }

    function bindField(id, prop, coerce) {
      const input = document.getElementById(id);
      input.addEventListener("input", () => {
        const region = selectedRegion();
        if (!region) return;
        region[prop] = coerce ? coerce(input) : input.value;
        if (prop === "name") renderRegionList();
        updateStats();
      });
      input.addEventListener("change", () => {
        const region = selectedRegion();
        if (!region) return;
        region[prop] = coerce ? coerce(input) : input.value;
        if (prop === "name") renderRegionList();
        updateStats();
      });
    }

    function updateStats() {
      const entranceCount = regions.reduce((sum, region) => sum + region.entrances.length, 0);
      const cellCount = regions.reduce((sum, region) => sum + region.cellCount, 0);
      document.getElementById("regionTotal").textContent = String(regions.length);
      document.getElementById("cellTotal").textContent = String(cellCount);
      document.getElementById("entranceTotal").textContent = String(entranceCount);
    }

    function toggleEntrance(row, col) {
      const region = selectedRegion();
      if (!region || !region.cellSet.has(keyOf(row, col))) return;
      const index = region.entrances.findIndex(item => item.row === row && item.col === col);
      if (index >= 0) region.entrances.splice(index, 1);
      else region.entrances.push({ row, col });
      region.entrances.sort((a, b) => a.row - b.row || a.col - b.col);
      renderSelectedRegion();
      updateStats();
      requestRender();
    }

    function handleCanvasClick(event) {
      const pt = eventPoint(event);
      const { row, col } = worldToCell(screenToWorld(pt.x, pt.y));
      const key = keyOf(row, col);
      if (entranceMode) {
        toggleEntrance(row, col);
        return;
      }
      const regionId = regionByCell.get(key);
      if (regionId) selectRegion(regionId);
    }

    function beginPointer(event) {
      const pt = eventPoint(event);
      const shouldPan = spaceDown || event.button === 1 || event.button === 2;
      pointerState = {
        mode: shouldPan ? "pan" : "click",
        startX: pt.x,
        startY: pt.y,
        lastX: pt.x,
        lastY: pt.y,
        moved: false
      };
      canvas.setPointerCapture(event.pointerId);
      event.preventDefault();
    }

    function movePointer(event) {
      updateCellStatus(event);
      if (!pointerState) return;
      const pt = eventPoint(event);
      const dx = pt.x - pointerState.lastX;
      const dy = pt.y - pointerState.lastY;
      if (Math.hypot(pt.x - pointerState.startX, pt.y - pointerState.startY) > 4) pointerState.moved = true;
      if (pointerState.mode === "pan") {
        view.x += dx;
        view.y += dy;
        requestRender();
      }
      pointerState.lastX = pt.x;
      pointerState.lastY = pt.y;
      event.preventDefault();
    }

    function endPointer(event) {
      if (pointerState?.mode === "click" && !pointerState.moved) handleCanvasClick(event);
      pointerState = null;
      try {
        canvas.releasePointerCapture(event.pointerId);
      } catch (_) {}
      event.preventDefault();
    }

    function zoomAt(event) {
      const pt = eventPoint(event);
      const before = screenToWorld(pt.x, pt.y);
      const factor = Math.exp(-event.deltaY * 0.0015);
      view.scale = Math.max(0.025, Math.min(8, view.scale * factor));
      view.x = pt.x - before.x * view.scale;
      view.y = pt.y - before.y * view.scale;
      requestRender();
      event.preventDefault();
    }

    function updateViewportStatus() {
      const pct = Math.round(view.scale * 100);
      document.getElementById("viewportStatus").textContent = `${imageSize.width}x${imageSize.height}; zoom ${pct}%; regions ${regions.length}`;
    }

    function updateCellStatus(event) {
      const pt = eventPoint(event);
      const world = screenToWorld(pt.x, pt.y);
      const { row, col } = worldToCell(world);
      const regionId = regionByCell.get(keyOf(row, col));
      const inside = world.x >= 0 && world.y >= 0 && world.x < imageSize.width && world.y < imageSize.height;
      document.getElementById("cellStatus").textContent = inside
        ? `row ${row}, col ${col}; ${regionId || "no region"}`
        : "Outside image";
    }

    function buildRegionsExport() {
      return {
        version: 1,
        imageName: IMAGE_NAME,
        imageSize,
        gridSize: GRID_SIZE,
        sourceAnnotation: ANNOTATION_NAME,
        generation: {
          terrains: Array.from(GENERATED_TERRAINS),
          connectivity: 4,
          area: "cellCount"
        },
        regions: regions.map(region => ({
          id: region.id,
          terrain: region.terrain,
          cellCount: region.cellCount,
          bounds: region.bounds,
          area: region.area,
          name: region.name || "",
          function: region.function || "",
          entrances: region.entrances.map(item => ({ row: item.row, col: item.col })),
          available: !!region.available,
          open_time: region.open_time || "00:00",
          close_time: region.close_time || "23:59"
        }))
      };
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function exportRegionsJson() {
      const data = buildRegionsExport();
      downloadBlob(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }), "regions.json");
    }

    function applyRegionMetadata(data) {
      const incoming = new Map((data.regions || []).map(region => [region.id, region]));
      for (const region of regions) {
        const saved = incoming.get(region.id);
        if (!saved) continue;
        region.name = saved.name || "";
        region.function = saved.function || "";
        region.available = saved.available !== false;
        region.open_time = saved.open_time || "00:00";
        region.close_time = saved.close_time || "23:59";
        region.entrances = Array.isArray(saved.entrances)
          ? saved.entrances.filter(item => Number.isInteger(item.row) && Number.isInteger(item.col) && region.cellSet.has(keyOf(item.row, item.col)))
          : [];
      }
      renderRegionList();
      renderSelectedRegion();
      updateStats();
      requestRender();
    }

    function readJsonFile(file, callback) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          callback(JSON.parse(String(reader.result)));
        } catch (error) {
          alert(`Import failed: ${error.message}`);
        }
      };
      reader.readAsText(file);
    }

    function loadAnnotation(annotation) {
      if (!Array.isArray(annotation.cells)) throw new Error("annotations JSON must contain a cells array.");
      sourceAnnotation = annotation;
      if (annotation.imageSize) imageSize = annotation.imageSize;
      const nextRegions = generateRegions(annotation);
      setRegions(nextRegions);
      document.getElementById("dataStatus").textContent = `Generated ${nextRegions.length} regions from ${annotation.cells.length} terrain cells.`;
    }

    async function loadDefaultAnnotation() {
      try {
        const response = await fetch(ANNOTATION_NAME, { cache: "no-store" });
        if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
        loadAnnotation(await response.json());
      } catch (error) {
        document.getElementById("dataStatus").textContent = `Could not auto-load annotations.json: ${error.message}`;
      }
    }

    function setupEvents() {
      window.addEventListener("resize", () => {
        resizeCanvas();
        requestRender();
      });
      window.addEventListener("keydown", event => {
        if (event.code === "Space") {
          spaceDown = true;
          canvas.classList.add("panning");
          event.preventDefault();
        }
      });
      window.addEventListener("keyup", event => {
        if (event.code === "Space") {
          spaceDown = false;
          canvas.classList.remove("panning");
        }
      });

      canvas.addEventListener("pointerdown", beginPointer);
      canvas.addEventListener("pointermove", movePointer);
      canvas.addEventListener("pointerup", endPointer);
      canvas.addEventListener("pointercancel", endPointer);
      canvas.addEventListener("wheel", zoomAt, { passive: false });
      canvas.addEventListener("contextmenu", event => event.preventDefault());

      document.getElementById("terrainFilter").addEventListener("change", event => {
        terrainFilter = event.target.value;
        const selected = selectedRegion();
        if (selected && terrainFilter !== "all" && selected.terrain !== terrainFilter) {
          selectedRegionId = null;
        }
        renderRegionList();
        renderSelectedRegion();
        requestRender();
      });
      document.getElementById("terrainFile").addEventListener("change", event => {
        const file = event.target.files?.[0];
        if (!file) return;
        readJsonFile(file, data => loadAnnotation(data));
        event.target.value = "";
      });
      document.getElementById("regionsFile").addEventListener("change", event => {
        const file = event.target.files?.[0];
        if (!file) return;
        readJsonFile(file, data => applyRegionMetadata(data));
        event.target.value = "";
      });
      document.getElementById("exportRegions").addEventListener("click", exportRegionsJson);
      document.getElementById("entranceMode").addEventListener("click", () => {
        entranceMode = !entranceMode;
        renderSelectedRegion();
      });
      document.getElementById("clearEntrances").addEventListener("click", () => {
        const region = selectedRegion();
        if (!region) return;
        region.entrances = [];
        renderSelectedRegion();
        updateStats();
        requestRender();
      });

      bindField("regionName", "name");
      bindField("regionFunction", "function");
      bindField("regionAvailable", "available", input => input.checked);
      bindField("regionOpenTime", "open_time");
      bindField("regionCloseTime", "close_time");
    }

    img.onload = () => {
      imageSize = { width: img.naturalWidth, height: img.naturalHeight };
      resizeCanvas();
      fitImage();
      requestRender();
    };

    img.onerror = () => {
      document.getElementById("viewportStatus").textContent = "Failed to load BHmap.png";
      alert("Could not load BHmap.png. Keep region.html and BHmap.png in the same folder.");
    };

    setupEvents();
    img.src = IMAGE_NAME;
    loadDefaultAnnotation();
    window.__BH_REGION_ANNOTATOR__ = {
      get regions() { return regions; },
      getExportData: buildRegionsExport,
      selectRegion,
      toggleEntrance
    };
  </script>
</body>
</html>
